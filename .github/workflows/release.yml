name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  name: linux-x86_64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: linux-arm64,  zig: true }
          - { os: macos-latest,  target: x86_64-apple-darwin,        name: macos-x86_64 }
          - { os: macos-latest,  target: aarch64-apple-darwin,       name: macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then cargo zigbuild --release --locked --target ${{ matrix.target }}
          else cargo build --release --locked --target ${{ matrix.target }}; fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dsync${{ matrix.exe }} dist/dsync-${{ matrix.name }}${{ matrix.exe }}
      - name: Runtime smoke test (native targets only)
        if: matrix.name == 'linux-x86_64' || matrix.name == 'macos-arm64' || matrix.name == 'windows-x86_64'
        shell: bash
        run: dist/dsync-${{ matrix.name }}${{ matrix.exe }} version
      - uses: actions/upload-artifact@v4
        with:
          name: dsync-${{ matrix.name }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum dsync-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Bump Formula/drivesync.rb in scaleninja/homebrew-tap so `brew install scaleninja/tap/drivesync`
  # picks up this release. Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained PAT with
  # "Contents: read and write" on scaleninja/homebrew-tap. Skips (with a warning) if it's unset.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render formula
        run: |
          (cd dist && sha256sum dsync-* > SHA256SUMS)
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > drivesync.rb
          ruby -c drivesync.rb
          cat drivesync.rb
      - name: Push to scaleninja/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; not updating the Homebrew tap"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/scaleninja/homebrew-tap" tap
          mkdir -p tap/Formula
          cp drivesync.rb tap/Formula/drivesync.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/drivesync.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "drivesync ${GITHUB_REF_NAME#v}"
          git push
