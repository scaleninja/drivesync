[package]
name = "drivesync"
version = "0.1.0"
edition = "2021"
description = "DriveSync (dsync): push, pull and diff a local directory against Google Drive"
license = "MIT"
repository = "https://github.com/scaleninja/drivesync"
homepage = "https://github.com/scaleninja/drivesync"
readme = "README.md"
keywords = ["google-drive", "sync", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "dsync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
fd-lock = "4"
filetime = "0.2"
getrandom = "0.2"
ignore = "0.4"
md5 = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
